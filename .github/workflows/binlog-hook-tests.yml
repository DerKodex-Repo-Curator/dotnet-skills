name: binlog-hook-tests

on:
  pull_request:
    paths:
      - "plugins/dotnet-msbuild/hooks/**"
      - "plugins/dotnet-msbuild/**/plugin.json"
      - "plugins/dotnet-msbuild/plugin.json"
      - "eng/hooks/**"
      - ".github/workflows/binlog-hook-tests.yml"
  push:
    branches: [main]
    paths:
      - "plugins/dotnet-msbuild/hooks/**"
      - "plugins/dotnet-msbuild/**/plugin.json"
      - "plugins/dotnet-msbuild/plugin.json"
      - "eng/hooks/**"
      - ".github/workflows/binlog-hook-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: "10.0.x"
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Run hook regressions
        run: python eng/hooks/test_binlog_preflight.py
